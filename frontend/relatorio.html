<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Fabricação / Manufacturing Report</title>
  <link rel="stylesheet" href="/relatorio.css">
</head>

<body>

<div class="report">

<header class="report-header print-header">

  <img src="/logo_Carbogas.png" class="logo">

  <div class="header-center">

    <div class="header-info">
      <h1>MTS v1.0 - Manufacturing Tracking System</h1>
      <h1>Relatório de Fabricação / Manufacturing Report</h1>

      <div id="infoOP"></div>
      <div id="dataRelatorio"></div>
    </div>

  </div>

  <img id="qrRelatorio" class="qr">

</header>

<div class="status-fixo">

  <div class="linha-separadora"></div>

<div class="status-linha">
  <strong>Status Final / Final Status:</strong>
  <span id="statusFinal"></span>
</div>

  <div class="linha-separadora"></div>

</div>
  
  <div id="componentesRelatorio"></div>

  <!-- OBSERVAÇÕES -->
  <section style="margin-top:25px;">
    <strong>Observações / Notes:</strong>
    <div style="height:70px;border-bottom:1px solid #000;"></div>
  </section>

  <section class="assinaturas">
    <div>
      ___________________________<br>
      Responsável Produção
    </div>

    <div>
      ___________________________<br>
      Controle da Qualidade
    </div>
  </section>

</div>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<!-- Adapter de datas -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

<!-- Plugin datalabels (não afeta gantt) -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script>
  Chart.register(ChartDataLabels);
</script>

<!-- Script -->
<script src="/relatorio.js"></script>

</body>
</html>
