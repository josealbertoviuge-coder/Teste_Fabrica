<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="style.css">
  
<title>Rastreamento de Peça</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

<style>
body{
  font-family: Arial;
  background:#f4f6f8;
}

.container{
  width:600px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,button{
  padding:10px;
  width:100%;
  margin-top:10px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>Consulta de Peça</h2>

<input id="codigo" placeholder="Digite o código da peça">
<button onclick="buscar()">Buscar</button>

<table id="tabela"></table>

<canvas id="grafico"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
