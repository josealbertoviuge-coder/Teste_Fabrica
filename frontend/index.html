<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tracking de Fabricação</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- TOPO -->
<div class="topo-wrapper">
  <img id="qrcode">
  
  <!-- LOGO -->
  <img id="logo" src="/logo_Carbogas.png" alt="Logo">
  
<div class="header-card">
  <h2 id="titulo">Consulta de Equipamento</h2>
  <div id="linhaInfo"></div>
  <div id="tempoTotal"></div>
</div>
</div>

<!-- CONTEÚDO -->
<div class="container">

  <input id="codigo">
  <button onclick="buscar()">Buscar</button>

  <!-- TABELA -->
  <table>
    <tbody id="tabela"></tbody>
  </table>

  <br><br>

  <!-- GANTT -->
  <div class="gantt-wrapper">
    <canvas id="grafico"></canvas>
  </div>

  <br><br>

  <!-- GRÁFICO DE DURAÇÃO -->
  <canvas id="graficoDuracao" height="200"></canvas>

</div>

<footer class="footer">
  Desenvolvido por <strong>José Alberto Viuge - Gerente de Controle da Qualidade Carbogas - 02/2026</strong>
</footer>

  
<!-- SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script src="/script.js"></script>

</body>
</html>
