<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MTS v1.0 - Manufacturing Tracking System</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- =======================
     LOADING BAR
======================= -->
<div id="loadingBar"></div>

<!-- =======================
     TOPO
======================= -->
<div class="topo-wrapper">

  <!-- COLUNA ESQUERDA: QR + LOGO -->
  <div class="qr-logo">
    <img id="logo" src="/logo_Carbogas.png" alt="Logo">
    <img id="qrcode" alt="QR Code">
  </div>

  <!-- BLOCO CENTRAL -->
  <div class="header-area">

    <div class="header-card">
      <h2 id="titulo">MTS v1.0 - Manufacturing Tracking System</h2>
      <div id="linhaInfo"></div>
      <div id="tempoTotal"></div>
    </div>

    <div class="legenda-status">
      <div class="legenda-item">
        <span class="cor azul"></span>
        Etapas Concluídas / Concluded Steps
      </div>
      <div class="legenda-item">
        <span class="cor laranja"></span>
        Etapas em Andamento / Steps in Progress
      </div>
    </div>

    <button class="btn-relatorio" onclick="abrirRelatorio()">
      Relatório / Report
    </button>

  </div>

</div>

<!-- =======================
     LAYOUT PRINCIPAL
======================= -->
<div class="layout">

  <!-- =======================
       MENU LATERAL (TAGS)
  ======================= -->
  <aside class="sidebar">

    <div class="sidebar-title">
      TAG's
    </div>

    <div id="abasTags" class="tag-list">
      <!-- JS cria as TAGs aqui -->
    </div>

  </aside>

  <!-- =======================
       CONTEÚDO PRINCIPAL
  ======================= -->
  <main class="main-content">

    <!-- ===================== -->
    <!-- GUIAS DE COMPONENTES -->
    <!-- ===================== -->
    <div class="abas-wrapper">
      <div id="abasComponentes" class="abas"></div>
    </div>
    <br><br>

    <!-- ===================== -->
    <!-- CONTEÚDO DINÂMICO -->
    <!-- ===================== -->
    <div id="conteudo-componente">

      <!-- TABELA -->
      <div class="tabela-wrapper">
        <table>
          <tbody id="tabela"></tbody>
        </table>
      </div>

      <br>

      <!-- GANTT -->
      <div class="gantt-wrapper">
        <canvas id="grafico"></canvas>
      </div>

      <br><br>

      <!-- GRÁFICO DE DURAÇÃO -->
      <canvas id="graficoDuracao"></canvas>

    </div>

  </main>

</div>

<footer class="footer">
  Desenvolvido por
  <strong>
    José Alberto Viuge - Gerente de Controle da Qualidade Carbogas - 02/2026
  </strong>
<br>
  Developed by
  <strong>
    José Alberto Viuge - Carbogas Quality Control Manager - 02/2026
  </strong>

</footer>

<!-- SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script src="/script.js"></script>

</body>
</html>
