<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Rastreabilidade de Peça</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
}

.container{
  width:400px;
  margin:80px auto;
  background:white;
  padding:25px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input, button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{
  background:#2d89ef;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  background:#1b5fbf;
}

.resultado{
  margin-top:20px;
  padding:10px;
  background:#eee;
}
</style>

</head>

<body>

<div class="container">
  <h2>Consulta de Peça</h2>

  <input id="codigo" placeholder="Digite o código da peça">

  <button onclick="buscar()">Buscar</button>

  <div class="resultado" id="resultado"></div>
</div>

<script>
async function buscar(){

  const codigo = document.getElementById("codigo").value;

  const resposta = await fetch(
    "https://teste-fabrica.onrender.com/peca/" + codigo
  );

  const dados = await resposta.json();

  if(!dados || !dados.codigo_peca){
    document.getElementById("resultado").innerHTML =
      "Peça não encontrada";
    return;
  }

  document.getElementById("resultado").innerHTML = `
    <b>Código:</b> ${dados.codigo_peca}<br>
    <b>Descrição:</b> ${dados.descricao}<br>
    <b>Etapa:</b> ${dados.nome_etapa}<br>
    <b>Status:</b> ${dados.status}
  `;
}
</script>

</body>
</html>
